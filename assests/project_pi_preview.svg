<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <radialGradient id="piBg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0b1622" />
      <stop offset="65%" stop-color="#06090e" />
      <stop offset="100%" stop-color="#020406" />
    </radialGradient>
    <linearGradient id="streamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3caea3" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#3caea3" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#4ecdc4" stop-opacity="0.1" />
    </linearGradient>
    <filter id="piGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#piBg)" />

  <!-- Code/Matrix Grid Line Tickers -->
  <g opacity="0.15" stroke="#3caea3" stroke-width="0.5">
    <line x1="0" y1="75" x2="800" y2="75" />
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="225" x2="800" y2="225" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="375" x2="800" y2="375" />
  </g>

  <!-- Big Mathematical Constant Pi Symbol in Background -->
  <text x="400" y="275" font-family="'Bebas Neue', sans-serif" font-size="280" font-weight="900" fill="#3caea3" fill-opacity="0.04" text-anchor="middle">&pi;</text>

  <!-- Base-36 Continuum Stream Ticker -->
  <g font-family="'JetBrains Mono', 'Courier New', monospace" font-size="12" fill="#64748b" opacity="0.65" letter-spacing="3">
    <text x="40" y="55">3.141592653589793238462643383279502884197169399375105820974944592307816406286</text>
    <text x="40" y="90">&gt; BASE-36: 3.4F82KL9NZWQ18YPA74BVM092X7C48D2L0OPQWER9128741BC90182740192874619</text>
    <text x="40" y="125">AVX-512 y-cruncher engine &bull; RADIX-36 &bull; 1,000,000,000 DIGITS PROCESSED</text>
  </g>

  <!-- Discovered 0-Gap Word Chains Highlight Boxes -->
  <g transform="translate(60, 160)">
    <!-- Chain 1 -->
    <rect x="0" y="0" width="310" height="90" rx="8" fill="#101923" stroke="#3caea3" stroke-width="1.5" filter="url(#piGlow)" />
    <text x="20" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#3caea3" letter-spacing="1">STRICT 0-GAP DISCOVERY #1</text>
    <text x="20" y="62" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="800" fill="#ffffff" letter-spacing="2">LIP <tspan fill="#3caea3">&bull;</tspan> HEY <tspan fill="#3caea3">&bull;</tspan> DIET</text>
    <text x="20" y="80" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#a0aec0">Digits 41,209,114 &ndash; 41,209,124</text>

    <!-- Chain 2 -->
    <rect x="360" y="0" width="310" height="90" rx="8" fill="#101923" stroke="#4ecdc4" stroke-width="1.5" filter="url(#piGlow)" />
    <text x="380" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#4ecdc4" letter-spacing="1">STRICT 0-GAP DISCOVERY #2</text>
    <text x="380" y="62" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="800" fill="#ffffff" letter-spacing="2">UNIFY <tspan fill="#4ecdc4">&bull;</tspan> JOIN</text>
    <text x="380" y="80" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#a0aec0">Digits 184,902,301 &ndash; 184,902,310</text>
  </g>

  <!-- Interactive Waveform Visualizer -->
  <path d="M 40 310 Q 120 280 200 310 T 360 310 T 520 290 T 680 320 T 760 310" fill="none" stroke="url(#streamGrad)" stroke-width="2.5" />

  <!-- Engine Specs / Badge -->
  <g transform="translate(40, 375)" font-family="'Plus Jakarta Sans', sans-serif">
    <rect width="720" height="42" rx="6" fill="#080808" fill-opacity="0.8" stroke="#3caea3" stroke-opacity="0.3" stroke-width="1" />
    <text x="20" y="26" font-size="11" font-weight="700" fill="#3caea3" letter-spacing="1">AVX-512 Y-CRUNCHER</text>
    <text x="190" y="26" font-size="11" fill="#a0aec0">&bull; SQLite WAL Indexing</text>
    <text x="360" y="26" font-size="11" fill="#a0aec0">&bull; WordNet Tier Classification</text>
    <text x="560" y="26" font-size="11" fill="#3caea3">&bull; Sub-ms Zero-Copy Ticker</text>
  </g>
</svg>
