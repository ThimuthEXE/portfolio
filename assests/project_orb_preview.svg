<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0f1922" />
      <stop offset="70%" stop-color="#06090e" />
      <stop offset="100%" stop-color="#030508" />
    </radialGradient>
    <radialGradient id="orbGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3caea3" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#20639b" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#3caea3" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="35%" stop-color="#3caea3" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3caea3" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="ringGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3caea3" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#20639b" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#3caea3" stop-opacity="0.7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />

  <!-- Background Coordinate Grid -->
  <g opacity="0.12" stroke="#3caea3" stroke-width="0.75" stroke-dasharray="3,6">
    <line x1="0" y1="112" x2="800" y2="112" />
    <line x1="0" y1="225" x2="800" y2="225" />
    <line x1="0" y1="337" x2="800" y2="337" />
    <line x1="200" y1="0" x2="200" y2="450" />
    <line x1="400" y1="0" x2="400" y2="450" />
    <line x1="600" y1="0" x2="600" y2="450" />
  </g>

  <!-- Ambient Glow Behind Orb -->
  <circle cx="400" cy="225" r="160" fill="url(#orbGlow)" />

  <!-- Orbital Rings with Inclination -->
  <g transform="translate(400, 225) rotate(-22)" fill="none">
    <ellipse cx="0" cy="0" rx="210" ry="85" stroke="url(#ringGrad1)" stroke-width="1.5" stroke-dasharray="8,6" opacity="0.65" />
    <ellipse cx="0" cy="0" rx="170" ry="60" stroke="#3caea3" stroke-width="1.2" opacity="0.5" />
    <ellipse cx="0" cy="0" rx="125" ry="42" stroke="#4ecdc4" stroke-width="1.8" stroke-dasharray="14,10" opacity="0.7" />
    <ellipse cx="0" cy="0" rx="80" ry="26" stroke="#ffffff" stroke-width="1" opacity="0.4" />
  </g>

  <!-- Knowledge Graph Synapses (NetworkX Dream Bridges) -->
  <g stroke="#3caea3" stroke-width="1.2" opacity="0.55">
    <line x1="400" y1="225" x2="240" y2="135" />
    <line x1="400" y1="225" x2="570" y2="120" />
    <line x1="400" y1="225" x2="210" y2="310" />
    <line x1="400" y1="225" x2="580" y2="320" />
    <line x1="240" y1="135" x2="570" y2="120" stroke-dasharray="4,4" opacity="0.3" />
    <line x1="210" y1="310" x2="580" y2="320" stroke-dasharray="4,4" opacity="0.3" />
  </g>

  <!-- Epistemic Nodes & Weights -->
  <g font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#ffffff" letter-spacing="0.5">
    <!-- MOTHER: 1.0 -->
    <circle cx="240" cy="135" r="7" fill="#3caea3" filter="url(#glow)" />
    <text x="220" y="118" fill="#3caea3" text-anchor="middle">MOTHER: 1.00</text>
    <text x="220" y="104" font-size="9" fill="#a0aec0" text-anchor="middle">MAX TRUST AXIOM</text>

    <!-- TEACHER: 0.85 -->
    <circle cx="570" cy="120" r="6" fill="#4ecdc4" filter="url(#glow)" />
    <text x="590" y="105" fill="#4ecdc4">TEACHER: 0.85</text>
    <text x="590" y="92" font-size="9" fill="#a0aec0">VERIFIED DIALOGUE</text>

    <!-- FRIEND: 0.55 -->
    <circle cx="210" cy="310" r="5" fill="#20639b" />
    <text x="190" y="335" fill="#a0aec0" text-anchor="middle">FRIEND: 0.55</text>

    <!-- REM DREAM CONSOLIDATION -->
    <circle cx="580" cy="320" r="5" fill="#3caea3" />
    <text x="600" y="335" fill="#3caea3">REM SLEEP SYNTHESIS</text>
    <text x="600" y="348" font-size="9" fill="#a0aec0">2-Hop Knowledge Bridge</text>
  </g>

  <!-- Celestial Central Orb Core -->
  <circle cx="400" cy="225" r="48" fill="url(#coreGlow)" filter="url(#glow)" />
  <circle cx="400" cy="225" r="32" fill="#0b1418" stroke="#3caea3" stroke-width="2.5" />
  <circle cx="400" cy="225" r="14" fill="#ffffff" filter="url(#glow)" />

  <!-- Orb HUD Reticle Accents -->
  <g stroke="#3caea3" stroke-width="1.5" opacity="0.8">
    <path d="M 370 225 L 360 225" />
    <path d="M 430 225 L 440 225" />
    <path d="M 400 195 L 400 185" />
    <path d="M 400 255 L 400 265" />
  </g>

  <!-- Title Badge overlay -->
  <g transform="translate(24, 395)" font-family="'Plus Jakarta Sans', system-ui, sans-serif">
    <rect width="280" height="34" rx="6" fill="#080808" fill-opacity="0.75" stroke="#3caea3" stroke-opacity="0.3" stroke-width="1" />
    <circle cx="16" cy="17" r="4" fill="#3caea3" />
    <text x="28" y="21" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="1">PROJECT ORB &bull; 100% OFFLINE AI</text>
  </g>
</svg>
